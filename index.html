<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Transcribe Ultra v2.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --accent: #00e5a0; --accent2: #7c5cfc; --bg: #0a0a0f; }
        body { font-family: 'JetBrains Mono', monospace; background: var(--bg); color: #e8e8f0; }
        .setup-card { background: rgba(17, 17, 24, 0.9); border: 1px solid #2a2a38; }
        .step-box { border: 1px solid #2a2a38; background: #111118; transition: all 0.3s; }
        .step-box.active { border-color: var(--accent); box-shadow: 0 0 15px rgba(0,229,160,0.2); }
        .step-box.done { background: rgba(0,229,160,0.05); border-color: var(--accent); }
        .timer-label { font-size: 9px; color: var(--accent); margin-top: 4px; font-weight: bold; }
        .master-scroll { height: 400px; overflow-y: auto; border: 1px solid #2a2a38; border-radius: 12px; }
        .master-scroll::-webkit-scrollbar { width: 4px; }
        .master-scroll::-webkit-scrollbar-thumb { background: #2a2a38; border-radius: 10px; }
        .hidden { display: none; }
    </style>
</head>
<body class="min-h-screen p-4">

    <!-- PAGE 1: SETUP -->
    <div id="setup-page" class="max-w-xl mx-auto mt-10 space-y-8">
        <header class="text-center flex flex-col items-center">
            <!-- Gurudev Photo (v2.5) -->
            <div class="mb-6 relative">
                <div class="w-20 h-20 rounded-full border-2 border-[var(--accent)] p-1 shadow-[0_0_20px_rgba(0,229,160,0.4)] overflow-hidden bg-[#111118]">
                    <img src="https://drive.google.com/uc?export=view&id=1C_zDrKi3Jto6coWwtM9RySOkCow9uAO1" 
                         alt="Gurudev" 
                         class="w-full h-full rounded-full object-cover scale-110">
                </div>
                <div class="absolute -bottom-2 left-1/2 -translate-x-1/2 bg-[var(--accent)] text-black text-[7px] font-bold px-2 py-0.5 rounded-full uppercase tracking-tighter shadow-lg">
                    Blessings
                </div>
            </div>
            <h1 class="text-3xl font-extrabold font-['Syne']">AI Transcribe <span class="text-[var(--accent)]">Ultra</span></h1>
            <p class="text-xs text-gray-500 mt-2 uppercase tracking-widest">Self-Learning v2.0</p>
        </header>

        <div class="setup-card p-8 rounded-3xl space-y-6 shadow-2xl">
            <div>
                <label class="text-[10px] uppercase text-gray-500 mb-3 block">1. Input File</label>
                <div onclick="document.getElementById('fileInput').click()" class="border-2 border-dashed border-[#2a2a38] rounded-2xl p-10 text-center cursor-pointer hover:border-[var(--accent)] transition-all bg-[#0d0d14]">
                    <i class="fas fa-cloud-upload-alt text-4xl mb-4 text-gray-600"></i>
                    <p class="text-sm font-bold" id="fileNameDisp">Drop file or Click</p>
                </div>
                <input type="file" id="fileInput" class="hidden" onchange="handleNewFile(this)">
            </div>

            <div>
                <label class="text-[10px] uppercase text-gray-500 mb-3 block">2. Processing Mode</label>
                <select class="w-full bg-[#111118] border border-[#2a2a38] p-4 rounded-xl text-sm outline-none">
                    <option>Auto (High Accuracy)</option>
                    <option>Fast Mode</option>
                </select>
            </div>

            <div>
                <label class="text-[10px] uppercase text-gray-500 mb-3 block">3. Domain Vocab</label>
                <input type="text" placeholder="Add custom words..." class="w-full bg-[#111118] border border-[#2a2a38] p-4 rounded-xl text-sm outline-none">
            </div>

            <button onclick="startPipeline()" id="mainProcessBtn" class="w-full bg-[var(--accent)] text-black py-5 rounded-2xl font-black uppercase tracking-tighter hover:scale-[1.02] transition-all shadow-lg shadow-green-500/20">
                🚀 Start Pipeline
            </button>

            <!-- Pipeline moved to Setup Page (v2.3) -->
            <div id="setup-pipeline" class="hidden mt-10 bg-[#111118] border border-[#2a2a38] p-6 rounded-3xl animate-pulse">
                <div class="flex justify-between items-center mb-6">
                    <span class="text-[10px] font-bold uppercase tracking-widest text-gray-500">Execution Status</span>
                    <span id="global-status" class="text-[9px] bg-orange-500/10 text-orange-400 px-2 py-1 rounded">SYNCING...</span>
                </div>
                <div class="flex items-center justify-between overflow-x-auto pb-4 gap-4" id="pipeline-row">
                    <div class="step-box p-4 rounded-2xl flex flex-col items-center min-w-[90px]" id="step-upload">
                        <i class="fas fa-file-upload"></i> <span class="text-[8px] mt-2">UPLOAD</span>
                        <div class="timer-label" id="t-upload">--</div>
                    </div>
                    <div class="w-8 h-[1px] bg-[#2a2a38]"></div>
                    <div class="step-box p-4 rounded-2xl flex flex-col items-center min-w-[90px]" id="step-chunk">
                        <i class="fas fa-cut"></i> <span class="text-[8px] mt-2">CHUNKING</span>
                        <div class="timer-label" id="t-chunk">--</div>
                    </div>
                    <div class="w-8 h-[1px] bg-[#2a2a38]"></div>
                    <div class="step-box p-4 rounded-2xl flex flex-col items-center min-w-[90px]" id="step-whisper">
                        <i class="fas fa-brain"></i> <span class="text-[8px] mt-2">WHISPER</span>
                        <div class="timer-label" id="t-whisper">--</div>
                    </div>
                    <div class="w-8 h-[1px] bg-[#2a2a38]"></div>
                    <div class="step-box p-4 rounded-2xl flex flex-col items-center min-w-[90px]" id="step-firebase">
                        <i class="fas fa-database"></i> <span class="text-[8px] mt-2">FIREBASE</span>
                        <div class="timer-label" id="t-firebase">--</div>
                    </div>
                    <div class="w-8 h-[1px] bg-[#2a2a38]"></div>
                    <div class="step-box p-4 rounded-2xl flex flex-col items-center min-w-[90px]" id="step-groq">
                        <i class="fas fa-bolt"></i> <span class="text-[8px] mt-2">GROQ AI</span>
                        <div class="timer-label" id="t-groq">--</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- PAGE 2: RESULTS ONLY -->
    <div id="monitor-page" class="max-w-4xl mx-auto hidden space-y-6">
        <!-- Media Player -->
        <div class="bg-black rounded-3xl overflow-hidden border border-[#2a2a38]">
            <video id="mediaPlayer" controls class="w-full aspect-video bg-[#000]"></video>
        </div>

        <!-- Result Stats -->
        <div class="grid grid-cols-2 gap-4">
            <div class="bg-[#111118] p-4 rounded-2xl border border-[#2a2a38]">
                <p class="text-[9px] text-gray-500 uppercase">Accuracy</p>
                <p class="text-xl font-bold text-[var(--accent)]" id="acc-val">99.9%</p>
            </div>
            <div class="bg-[#111118] p-4 rounded-2xl border border-[#2a2a38]">
                <p class="text-[9px] text-gray-500 uppercase">Language</p>
                <p class="text-xl font-bold text-indigo-400" id="lang-val">HI-IN</p>
            </div>
        </div>

        <!-- Master Transcript -->
        <div class="bg-[#111118] border border-[#2a2a38] rounded-3xl p-6">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-xs font-bold uppercase tracking-widest">Master Transcript</h3>
                <span class="text-[9px] text-green-500 flex items-center gap-1"><i class="fas fa-circle text-[6px]"></i> AUTO-SAVING</span>
            </div>
            <div class="master-scroll p-6 bg-[#0a0a0f]" id="transcript-box">
                <p class="text-gray-500 text-sm italic">Waiting for processing results...</p>
            </div>
        </div>

        <!-- Footer Actions -->
        <div class="flex gap-4 pb-10">
            <button onclick="downloadAsText()" class="flex-1 bg-white/5 py-5 rounded-2xl font-bold text-xs hover:bg-white/10 transition border border-[#2a2a38]">
                <i class="fas fa-download mr-2"></i> DOWNLOAD AS TEXT
            </button>
            <button onclick="goBack()" class="bg-indigo-500/10 text-indigo-400 px-8 rounded-2xl font-bold text-xs border border-indigo-500/20">
                <i class="fas fa-arrow-left mr-2"></i> BACK
            </button>
        </div>
    </div>

    <script>
        const HF_URL = "https://pryog-ai-ultra-transcribe.hf.space";
        let selectedFile = null;
        let pollingInterval = null;

        function handleNewFile(input) {
            if(!input.files[0]) return;
            selectedFile = input.files[0];
            document.getElementById('fileNameDisp').innerText = selectedFile.name;
            
            // Reset Button and Pipeline for New File (v2.4)
            const mainBtn = document.getElementById('mainProcessBtn');
            mainBtn.innerText = "🚀 Start Pipeline";
            mainBtn.disabled = false;
            document.getElementById('setup-pipeline').classList.add('hidden');
            resetPipelineUI();

            if(selectedFile.type.startsWith('video')) {
                document.getElementById('mediaPlayer').src = URL.createObjectURL(selectedFile);
            }
        }

        function resetPipelineUI() {
            document.getElementById('global-status').innerText = "READY";
            document.getElementById('global-status').className = "text-[9px] bg-orange-500/10 text-orange-400 px-2 py-1 rounded";
            const steps = ['upload', 'chunk', 'whisper', 'firebase', 'groq'];
            steps.forEach(id => {
                const timerEl = document.getElementById('t-' + id);
                const boxEl = document.getElementById('step-' + id);
                if(timerEl) {
                    timerEl.innerText = "--";
                    timerEl.style.color = "var(--accent)";
                }
                if(boxEl) boxEl.classList.remove('done', 'active');
            });
        }

        async function startPipeline() {
            const mainBtn = document.getElementById('mainProcessBtn');
            
            // If previous result exists, just switch page (v2.4)
            if (mainBtn.innerText.includes("VIEW PREVIOUS")) {
                document.getElementById('setup-page').classList.add('hidden');
                document.getElementById('monitor-page').classList.remove('hidden');
                return;
            }

            const fileInput = document.getElementById('fileInput');
            if(!selectedFile && !fileInput.files[0]) return alert("Bhai ji, file select kijiye!");
            
            if(!selectedFile) selectedFile = fileInput.files[0];
            
            // Show Pipeline on First Page
            document.getElementById('setup-pipeline').classList.remove('hidden');
            document.getElementById('mainProcessBtn').disabled = true;
            document.getElementById('mainProcessBtn').innerText = "⚙️ PROCESSING...";

            const formData = new FormData();
            formData.append('file', selectedFile);

            try {
                // 1. Start Job
                const res = await fetch(HF_URL + "/transcribe", { method: "POST", body: formData });
                const { job_id } = await res.json();

                // 2. Start Polling for Status
                pollingInterval = setInterval(() => checkJobStatus(job_id), 2000);

            } catch(e) {
                alert("Upload Error: " + e.message);
                document.getElementById('global-status').innerText = "UPLOAD FAILED";
            }
        }

        async function checkJobStatus(id) {
            try {
                const res = await fetch(HF_URL + "/status/" + id);
                const job = await res.json();

                // Update UI based on current step
                if(job.status === "chunking") updateStep('upload', 'done');
                if(job.status === "whisper") updateStep('chunk', 'done');
                if(job.status === "firebase") updateStep('whisper', 'done');
                if(job.status === "groq") updateStep('firebase', 'done');

                // Update Timings if available
                if(job.timings.upload) document.getElementById('t-upload').innerText = job.timings.upload + "s";
                if(job.timings.chunking) document.getElementById('t-chunk').innerText = job.timings.chunking + "s";
                if(job.timings.whisper) document.getElementById('t-whisper').innerText = job.timings.whisper + "s";
                if(job.timings.firebase) document.getElementById('t-firebase').innerText = job.timings.firebase + "s";
                if(job.timings.groq) {
                    const gVal = job.timings.groq;
                    document.getElementById('t-groq').innerText = (typeof gVal === 'number') ? gVal + "s" : gVal;
                    if(typeof gVal !== 'number') document.getElementById('t-groq').style.color = "red";
                }

                if(job.status === "completed") {
                    clearInterval(pollingInterval);
                    updateStep('groq', 'done');
                    
                    // Switch to Result Page after completion
                    setTimeout(() => {
                        document.getElementById('setup-page').classList.add('hidden');
                        document.getElementById('monitor-page').classList.remove('hidden');
                        document.getElementById('mediaPlayer').src = URL.createObjectURL(selectedFile);
                        
                        document.getElementById('global-status').innerText = "COMPLETED";
                        document.getElementById('global-status').className = "text-[9px] bg-green-500/10 text-green-400 px-2 py-1 rounded";
                        renderMasterResult(job.result.full_text, job.result.segments);
                    }, 500);

                    if(job.errors.length > 0) alert("Bhai ji, Groq me kuch issue tha: " + job.errors.join(", "));
                }

                if(job.status === "failed") {
                    clearInterval(pollingInterval);
                    document.getElementById('global-status').innerText = "TASK FAILED";
                    alert("System Error: " + job.errors.join("\n"));
                }
            } catch(e) { console.error("Polling error", e); }
        }

        function updateStep(id, status) {
            const el = document.getElementById('step-' + id);
            if(status === 'active') el.classList.add('active');
            if(status === 'done') { el.classList.remove('active'); el.classList.add('done'); }
        }

        function renderMasterResult(fullText, segments) {
            const box = document.getElementById('transcript-box');
            box.innerHTML = `
                <div class="mb-8">
                    <label class="text-[9px] text-[var(--accent)] font-bold mb-4 block uppercase tracking-tighter">AI Optimized Final Output</label>
                    <div contenteditable="true" class="text-white text-md leading-loose outline-none" id="final-p">${fullText}</div>
                </div>
                <div class="opacity-20 my-8 border-t border-dashed border-white"></div>
                <label class="text-[9px] text-gray-500 font-bold mb-4 block uppercase">Timestamp Breakdown</label>
                <div class="space-y-4">
                    ${segments.map(s => `
                        <div class="flex gap-4 group">
                            <span class="text-[10px] text-gray-600 font-bold w-12 pt-1 cursor-pointer hover:text-white" onclick="seek(${s.start})">${s.start}s</span>
                            <p class="text-sm text-gray-400 group-hover:text-gray-200 transition-colors">${s.text}</p>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function seek(t) { 
            const p = document.getElementById('mediaPlayer');
            p.currentTime = t; p.play(); 
        }

        function downloadAsText() {
            const text = document.getElementById('final-p').innerText;
            const blob = new Blob([text], {type: 'text/plain;charset=utf-8'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = "master_transcript.txt"; a.click();
        }

        function goBack() {
            document.getElementById('monitor-page').classList.add('hidden');
            document.getElementById('setup-page').classList.remove('hidden');
            
            // Update button if processing was complete (v2.4)
            const mainBtn = document.getElementById('mainProcessBtn');
            const globalStatus = document.getElementById('global-status').innerText;
            
            if (globalStatus === "COMPLETED") {
                mainBtn.innerText = "👁️ VIEW PREVIOUS TRANSCRIPT";
                mainBtn.disabled = false;
            } else {
                mainBtn.innerText = "🚀 Start Pipeline";
                mainBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
