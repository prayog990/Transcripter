<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transcript Magic v1.0 - By AJ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');
        body { font-family: 'Poppins', sans-serif; background: #0f172a; color: white; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        .gradient-text { background: linear-gradient(90deg, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .loader { border-top-color: #38bdf8; animation: spinner 1.5s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">

    <div class="max-w-4xl mx-auto">
        <!-- Header -->
        <header class="flex justify-between items-center mb-10">
            <div>
                <h1 class="text-3xl font-bold gradient-text">Transcript Magic</h1>
                <p class="text-gray-400 text-sm">AI-Powered YouTube Transcription</p>
            </div>
            <button onclick="toggleSettings()" class="glass p-3 rounded-full hover:bg-slate-700 transition">
                <i class="fas fa-cog text-xl"></i>
            </button>
        </header>

        <!-- Main Input Card -->
        <main class="glass rounded-3xl p-6 md:p-10 shadow-2xl">
            <div class="mb-6 space-y-4">
                <!-- YouTube Link Input -->
                <div id="urlInputGroup">
                    <label class="block text-sm font-medium mb-2 text-gray-300">YouTube Video URL</label>
                    <div class="relative">
                        <input type="text" id="videoUrl" placeholder="https://www.youtube.com/watch?v=..." 
                            class="w-full bg-slate-900 border border-slate-700 rounded-xl py-4 px-12 focus:ring-2 focus:ring-sky-500 outline-none transition">
                        <i class="fab fa-youtube absolute left-4 top-5 text-red-500 text-xl"></i>
                    </div>
                </div>

                <!-- Divider -->
                <div class="relative flex py-2 items-center">
                    <div class="flex-grow border-t border-slate-800"></div>
                    <span class="flex-shrink mx-4 text-slate-500 text-[10px] font-bold uppercase tracking-widest">OR</span>
                    <div class="flex-grow border-t border-slate-800"></div>
                </div>

                <!-- File Upload Input -->
                <div id="fileInputGroup">
                    <label class="block text-sm font-medium mb-2 text-gray-300">Upload Audio File (MP3, WAV, etc.)</label>
                    <div class="relative">
                        <input type="file" id="audioFile" accept="audio/*" 
                            class="w-full bg-slate-900 border border-slate-700 rounded-xl py-3 px-4 text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-sky-500 file:text-white hover:file:bg-sky-600 transition cursor-pointer">
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
                <div>
                    <label class="block text-sm font-medium mb-2 text-gray-300">Select AI Model</label>
                    <select id="apiModel" class="w-full bg-slate-900 border border-slate-700 rounded-xl py-4 px-4 outline-none focus:ring-2 focus:ring-sky-500">
                        <option value="assemblyai">AssemblyAI (Best for Links)</option>
                        <option value="groq">Groq - Whisper V3 (Super Fast)</option>
                        <option value="deepgram">Deepgram (Low Latency)</option>
                        <option value="openai">OpenAI Whisper (Classic)</option>
                    </select>
                </div>
                <div class="flex items-end">
                    <button id="startBtn" onclick="processTranscript()" class="w-full bg-sky-500 hover:bg-sky-600 text-white font-bold py-4 rounded-xl shadow-lg shadow-sky-500/20 transition-all active:scale-95">
                        Get Transcript <i class="fas fa-magic ml-2"></i>
                    </button>
                </div>
            </div>

            <!-- Status Display -->
            <div id="statusArea" class="hidden text-center p-6 border-t border-slate-700 mt-6">
                <div class="loader ease-linear rounded-full border-4 border-t-4 border-gray-200 h-12 w-12 mb-4 mx-auto"></div>
                <p id="statusText" class="text-sky-400 font-medium">Processing Audio...</p>
            </div>

            <!-- Result Display -->
            <div id="resultArea" class="hidden mt-6 space-y-4">
                <div class="flex justify-between items-center">
                    <h3 class="font-bold text-xl">Transcript Result</h3>
                    <button onclick="copyText()" class="text-sm bg-slate-700 px-4 py-2 rounded-lg hover:bg-slate-600 transition">
                        <i class="fas fa-copy mr-2"></i>Copy
                    </button>
                </div>
                <div id="transcriptOutput" class="bg-slate-900 rounded-xl p-6 text-gray-300 leading-relaxed max-h-[400px] overflow-y-auto border border-slate-800">
                    आपका ट्रांसक्रिप्शन यहाँ दिखाई देगा...
                </div>
            </div>
        </main>

        <!-- Settings Modal -->
        <div id="settingsModal" class="fixed inset-0 bg-black/80 flex items-center justify-center hidden z-50 p-4">
            <div class="glass max-w-md w-full rounded-3xl p-8">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-bold">API Settings</h2>
                    <button onclick="toggleSettings()" class="text-gray-400 hover:text-white"><i class="fas fa-times"></i></button>
                </div>
                <div class="space-y-4">
                    <div>
                        <label class="text-xs text-gray-400 uppercase tracking-wider">AssemblyAI Key</label>
                        <input type="password" id="key_assemblyai" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 mt-1 outline-none">
                    </div>
                    <div>
                        <label class="text-xs text-gray-400 uppercase tracking-wider">Groq API Key</label>
                        <input type="password" id="key_groq" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 mt-1 outline-none">
                    </div>
                    <button onclick="saveKeys()" class="w-full bg-sky-500 py-3 rounded-xl font-bold mt-4">Save API Keys</button>
                    <p class="text-[10px] text-gray-500 text-center uppercase tracking-tighter">Your keys are stored locally in your browser.</p>
                </div>
            </div>
        </div>

        <footer class="text-center mt-10 text-gray-500 text-sm">
            Designed with ❤️ by AJ | Version 1.16
            https://youtu.be/P-c52MrWeGM?si=_Vx4cqVqp0mMKnB5
        </footer>
    </div>

<script>
    const statusText = document.getElementById('statusText');
    const statusArea = document.getElementById('statusArea');
    const resultArea = document.getElementById('resultArea');
    const transcriptOutput = document.getElementById('transcriptOutput');

    function toggleSettings() {
        document.getElementById('settingsModal').classList.toggle('hidden');
    }

    function saveKeys() {
        localStorage.setItem('key_assemblyai', document.getElementById('key_assemblyai').value);
        localStorage.setItem('key_groq', document.getElementById('key_groq').value);
        alert('Settings Saved Successfully!');
        toggleSettings();
    }

    window.onload = () => {
        document.getElementById('key_assemblyai').value = localStorage.getItem('key_assemblyai') || '';
        document.getElementById('key_groq').value = localStorage.getItem('key_groq') || '';
    };

    function copyText() {
        const text = transcriptOutput.innerText;
        navigator.clipboard.writeText(text);
        alert('Copied to clipboard!');
    }

    function extractVideoID(url) {
        const regExp = /^.*(youtu\.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
        const match = url.match(regExp);
        return (match && match[2].length == 11) ? match[2] : null;
    }

    async function processTranscript() {
        const rawUrl = document.getElementById('videoUrl').value.trim();
        const fileInput = document.getElementById('audioFile');
        const model = document.getElementById('apiModel').value;
        const key_aai = localStorage.getItem('key_assemblyai');

        // Validation: Check if either URL or File is provided
        if (!rawUrl && (!fileInput.files || fileInput.files.length === 0)) {
            alert('Bhai, please enter a YouTube link or upload an audio file!');
            return;
        }

        if (model !== 'assemblyai') {
            alert("Currently only AssemblyAI is supported for direct uploads. Please switch model.");
            return;
        }
        
        if (!key_aai) { 
            alert("Add AssemblyAI Key in Settings!"); 
            toggleSettings(); 
            return; 
        }

        statusArea.classList.remove('hidden');
        resultArea.classList.add('hidden');
        statusText.innerText = "AJ is checking your data...";

        try {
            if (fileInput.files && fileInput.files.length > 0) {
                // Scenario 1: User uploaded a file (CORS Safe!)
                const audioBlob = fileInput.files[0];
                await uploadAndTranscribe(key_aai, audioBlob);
            } else {
                // Scenario 2: User provided a link (Uses Proxy)
                const videoId = extractVideoID(rawUrl);
                if (!videoId) throw new Error("Invalid YouTube Link!");
                await startAJMasterTranscription(key_aai, videoId);
            }
        } catch (error) {
            alert(error.message);
            statusArea.classList.add('hidden');
        }
    }

    async function uploadAndTranscribe(key, audioData) {
        try {
            statusText.innerText = "Step 1: Uploading your file directly...";
            const upRes = await fetch('https://api.assemblyai.com/v2/upload', {
                method: 'POST',
                headers: { 'authorization': key },
                body: audioData
            });
            const upData = await upRes.json();
            if (!upData.upload_url) throw new Error("Upload failed. Check your API key.");

            statusText.innerText = "Step 2: AI is Transcribing (Safe Mode)...";
            const transRes = await fetch('https://api.assemblyai.com/v2/transcript', {
                method: 'POST',
                headers: { 'authorization': key, 'content-type': 'application/json' },
                body: JSON.stringify({ 
                    audio_url: upData.upload_url, 
                    speech_models: ["best"] 
                })
            });
            const transData = await transRes.json();
            pollAJResult(transData.id, key);
        } catch (err) {
            throw err;
        }
    }

    async function startProTranscription(key, youtubeUrl) {
        try {
            statusText.innerText = "Step 1: Cracking YouTube encryption...";
            
            // Using Cobalt API - The most powerful open bridge for YT audio
            const cobaltResp = await fetch("https://api.cobalt.tools/api/json", {
                method: "POST",
                headers: {
                    "Accept": "application/json",
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    url: youtubeUrl,
                    downloadMode: "audio",
                    audioFormat: "mp3"
                })
            });

            if (!cobaltResp.ok) throw new Error("YouTube bridge is busy. Try again in 10 seconds.");
            const cobaltData = await cobaltResp.json();
            
            if (cobaltData.status === "error") throw new Error("Bridge Error: " + cobaltData.text);
            
            const audioUrl = cobaltData.url;

            statusText.innerText = "Step 2: Securing audio stream...";
            const audioRes = await fetch(audioUrl);
            const audioBlob = await audioRes.blob();

            statusText.innerText = "Step 3: Uploading to AI Engine...";
            const upRes = await fetch('https://api.assemblyai.com/v2/upload', {
                method: 'POST',
                headers: { 'authorization': key },
                body: audioBlob
            });
            const upData = await upRes.json();
            if (!upData.upload_url) throw new Error("AI Upload failed.");

            statusText.innerText = "Step 4: AI is transcribing (Universal-3-Pro)...";
            const transRes = await fetch('https://api.assemblyai.com/v2/transcript', {
                method: 'POST',
                headers: { 'authorization': key, 'content-type': 'application/json' },
                body: JSON.stringify({ 
                    audio_url: upData.upload_url, 
                    speech_models: ["universal-3-pro"] 
                })
            });
            const transData = await transRes.json();
            if (transData.error) throw new Error(transData.error);
            
            pollResult(transData.id, key);
        } catch (err) {
            throw err;
        }
    }

    function pollResult(id, key) {
        const interval = setInterval(async () => {
            try {
                const res = await fetch(`https://api.assemblyai.com/v2/transcript/${id}`, {
                    headers: { 'authorization': key }
                });
                const data = await res.json();
                
                if (data.status === 'completed') {
                    clearInterval(interval);
                    statusArea.classList.add('hidden');
                    resultArea.classList.remove('hidden');
                    transcriptOutput.innerText = data.text;
                } else if (data.status === 'error') {
                    clearInterval(interval);
                    alert("AI Error: " + data.error);
                    statusArea.classList.add('hidden');
                }
            } catch (e) { console.error("Polling error:", e); }
        }, 5000);
    }
</script>
</body>
</html>
