<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YT Transcript Pro | Modern Fetcher</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at top left, #1a1a2e, #16213e, #0f3460);
            min-height: 100vh;
            color: white;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }
    </style>
</head>
<body class="flex items-center justify-center p-4 md:p-10">

    <div class="w-full max-w-4xl glass-card rounded-3xl p-6 md:p-10 transition-all duration-500">
        <div class="text-center mb-10">
            <h1 class="text-4xl md:text-5xl font-bold tracking-tight mb-2 bg-gradient-to-r from-red-500 to-pink-500 bg-clip-text text-transparent">
                YT Transcriber <span class="text-white font-light">Pro</span>
            </h1>
            <p class="text-gray-400 text-sm md:text-base">किसी भी यूट्यूब वीडियो से तुरंत टेक्स्ट (Transcript) निकालें</p>
        </div>

        <div class="relative group mb-8">
            <input type="text" id="videoUrl" 
                placeholder="https://www.youtube.com/watch?v=..." 
                class="w-full bg-white/5 border border-white/10 p-5 rounded-2xl outline-none focus:ring-2 focus:ring-red-500 transition-all text-lg placeholder:text-gray-500 pr-32">
            <button onclick="fetchTranscript()" id="fetchBtn"
                class="absolute right-2 top-2 bottom-2 bg-red-600 hover:bg-red-500 px-6 rounded-xl font-semibold flex items-center gap-2 transition-all active:scale-95">
                <i data-lucide="zap" class="w-5 h-5"></i> निकालें
            </button>
        </div>

        <div id="loading" class="hidden flex flex-col items-center justify-center py-10">
            <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-red-500 mb-4"></div>
            <p class="text-gray-400">डेटा प्रोसेस किया जा रहा है...</p>
        </div>

        <div id="resultContainer" class="hidden animate-in fade-in slide-in-from-bottom-4 duration-700">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-xl font-semibold flex items-center gap-2">
                    <i data-lucide="file-text" class="text-red-500"></i> ट्रांसक्रिप्ट
                </h3>
                <button onclick="copyToClipboard()" class="text-sm text-gray-400 hover:text-white flex items-center gap-1 transition-colors">
                    <i data-lucide="copy" class="w-4 h-4"></i> कॉपी करें
                </button>
            </div>
            <div id="transcriptBox" class="custom-scrollbar bg-black/30 rounded-2xl p-6 h-[400px] overflow-y-auto text-gray-300 leading-relaxed text-lg border border-white/5">
                </div>
        </div>

        <div id="error" class="hidden bg-red-500/10 border border-red-500/50 p-4 rounded-xl text-red-400 mb-6 text-center"></div>
    </div>

    <script>
        // Initialize Icons
        lucide.createIcons();

        async function fetchTranscript() {
            const urlInput = document.getElementById('videoUrl').value;
            const videoId = extractVideoId(urlInput);
            const btn = document.getElementById('fetchBtn');
            const loader = document.getElementById('loading');
            const result = document.getElementById('resultContainer');
            const errorDiv = document.getElementById('error');
            const textBox = document.getElementById('transcriptBox');

            if (!videoId) {
                showError("कृपया एक सही YouTube लिंक डालें।");
                return;
            }

            // Reset UI
            errorDiv.classList.add('hidden');
            result.classList.add('hidden');
            loader.classList.remove('hidden');
            btn.disabled = true;

            try {
                /* Note: ब्राउज़र में डायरेक्ट फेचिंग ब्लॉक होती है। 
                   यहाँ हम एक थ्रर्ड-पार्टी API का उपयोग कर रहे हैं जो बिना सर्वर के ट्रांसक्रिप्ट देता है।
                */
                const response = await fetch(`https://subtitles-api.vercel.app/api/transcript?videoId=${videoId}`);
                const data = await response.json();

                if (data.error) throw new Error("इस वीडियो के लिए ट्रांसक्रिप्ट उपलब्ध नहीं है।");

                // Formatting and Displaying
                let fullText = data.transcript.map(t => `<div class="mb-4"><span class="text-red-500/50 text-xs font-mono mr-2">${t.start}s</span>${t.text}</div>`).join('');
                textBox.innerHTML = fullText;
                
                loader.classList.add('hidden');
                result.classList.remove('hidden');
            } catch (err) {
                loader.classList.add('hidden');
                showError("माफ़ करें! डेटा फ़ेच करने में समस्या हुई। (CORS या No Subtitles)");
            } finally {
                btn.disabled = false;
            }
        }

        function extractVideoId(url) {
            const regex = /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/;
            const match = url.match(regex);
            return match ? match[1] : null;
        }

        function showError(msg) {
            const errorDiv = document.getElementById('error');
            errorDiv.innerText = msg;
            errorDiv.classList.remove('hidden');
        }

        function copyToClipboard() {
            const text = document.getElementById('transcriptBox').innerText;
            navigator.clipboard.writeText(text);
            alert("टेक्स्ट कॉपी हो गया है!");
        }
    </script>
</body>
</html>
