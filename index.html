<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AJ Transcript Tool</title>
    <style>
        :root {
            --primary: #2563eb;
            --bg: #f8fafc;
            --surface: #ffffff;
            --text: #1e293b;
            --border: #e2e8f0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--surface);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: var(--primary);
            margin-bottom: 1.5rem;
            font-size: 1.5rem;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        button:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
        }

        #status-msg {
            text-align: center;
            margin-bottom: 15px;
            font-size: 14px;
            color: #64748b;
            min-height: 20px;
        }

        .output-area {
            width: 100%;
            min-height: 300px;
            padding: 15px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background-color: #fff;
            font-size: 16px;
            line-height: 1.6;
            white-space: pre-wrap;
            box-sizing: border-box;
            display: none; /* Initially hidden */
        }

        .loading-spinner {
            display: none;
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>YouTube Transcript Generator</h1>
        
        <div class="input-group">
            <input type="text" id="ytUrl" placeholder="Paste YouTube Link here...">
            <button id="btnFetch" onclick="fetchTranscript()">Get Transcript</button>
        </div>

        <div id="status-msg"></div>
        <div class="loading-spinner" id="loader"></div>
        
        <!-- Result Box -->
        <div id="resultBox" class="output-area"></div>
    </div>

    <script>
        // AJ: Internal State - Memory for Future
        // Current Version: 1.0
        
        async function fetchTranscript() {
            const urlInput = document.getElementById('ytUrl').value;
            const statusMsg = document.getElementById('status-msg');
            const resultBox = document.getElementById('resultBox');
            const loader = document.getElementById('loader');
            const btn = document.getElementById('btnFetch');

            // Reset UI
            statusMsg.textContent = "";
            resultBox.style.display = "none";
            resultBox.innerText = "";
            
            // Extract Video ID
            const videoId = extractVideoId(urlInput);
            if (!videoId) {
                statusMsg.textContent = "Invalid YouTube URL";
                statusMsg.style.color = "red";
                return;
            }

            // Start Loading
            loader.style.display = "block";
            btn.disabled = true;
            statusMsg.textContent = "Fetching metadata...";
            statusMsg.style.color = "#64748b";

            try {
                // 1. Get Video Metadata from Piped API
                const metaUrl = `https://pipedapi.kavin.rocks/streams/${videoId}`;
                const response = await fetch(metaUrl);
                
                if (!response.ok) throw new Error("Failed to fetch video data");
                const data = await response.json();

                // 2. Find Subtitles (Priority: English -> Auto-generated English)
                const subtitles = data.subtitles;
                if (!subtitles || subtitles.length === 0) {
                    throw new Error("No subtitles found for this video.");
                }

                // Filter for English (or create logic for Hindi later)
                let selectedTrack = subtitles.find(s => s.code === 'en' && !s.autoGenerated) || 
                                    subtitles.find(s => s.code === 'en') ||
                                    subtitles[0]; // Fallback to first available

                statusMsg.textContent = `Downloading transcript (${selectedTrack.name})...`;

                // 3. Fetch the actual subtitle text (VTT/JSON format)
                const trackResponse = await fetch(selectedTrack.url);
                const trackText = await trackResponse.text();

                // 4. Clean and Parse VTT/XML to plain text
                const cleanText = parseTranscript(trackText);

                // Display Result
                resultBox.innerText = cleanText;
                resultBox.style.display = "block";
                statusMsg.textContent = "Done!";
                statusMsg.style.color = "green";

            } catch (error) {
                console.error(error);
                statusMsg.textContent = "Error: " + error.message;
                statusMsg.style.color = "red";
            } finally {
                loader.style.display = "none";
                btn.disabled = false;
            }
        }

        function extractVideoId(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        function parseTranscript(rawText) {
            // Basic VTT/JSON cleaner. 
            // Piped sometimes returns JSON for subs, sometimes VTT based on format.
            // This is a basic VTT stripper logic.
            
            try {
                // If it's JSON (sometimes Piped returns JSON array)
                const jsonCheck = JSON.parse(rawText);
                if (Array.isArray(jsonCheck)) {
                     // Filter out events without text and join
                    return jsonCheck.map(item => item.text).join(" ");
                }
            } catch (e) {
                // Not JSON, assume VTT/SRT format
            }

            // Remove VTT header
            let text = rawText.replace(/WEBVTT/g, "");
            
            // Remove timestamps (00:00:00.000 --> 00:00:00.000)
            text = text.replace(/(\d{2}:\d{2}:\d{2}\.\d{3} --> \d{2}:\d{2}:\d{2}\.\d{3})/g, "");
            text = text.replace(/(\d{2}:\d{2}\.\d{3} --> \d{2}:\d{2}\.\d{3})/g, ""); // Short format
            
            // Remove formatting tags like <c.color> or <b>
            text = text.replace(/<[^>]*>/g, "");
            
            // Remove specific VTT positioning lines (align:start position:0%)
            text = text.replace(/.*:\d+%.*/g, "");
            
            // Remove empty lines and join
            const lines = text.split('\n');
            const cleanLines = lines.map(l => l.trim()).filter(l => l !== "" && !Number.isInteger(Number(l)));
            
            // Remove duplicates that often appear in rolling captions
            const uniqueLines = [];
            if(cleanLines.length > 0) uniqueLines.push(cleanLines[0]);
            
            for(let i=1; i<cleanLines.length; i++) {
                if(cleanLines[i] !== cleanLines[i-1]) {
                    uniqueLines.push(cleanLines[i]);
                }
            }

            return uniqueLines.join(" ");
        }
    </script>
</body>
</html>
