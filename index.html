<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AJ Transcript AI</title>

<style>
body{
font-family:Arial, sans-serif;
background:#0f172a;
color:white;
display:flex;
justify-content:center;
padding:20px;
}

.container{
max-width:900px;
width:100%;
}

input{
width:70%;
padding:12px;
border-radius:8px;
border:none;
font-size:16px;
}

button{
padding:12px 18px;
border:none;
border-radius:8px;
background:#6366f1;
color:white;
font-weight:bold;
cursor:pointer;
}

#resultBox{
margin-top:20px;
background:#111827;
padding:20px;
border-radius:10px;
min-height:300px;
white-space:pre-wrap;
display:none;
}

#status{
margin-top:10px;
color:#9ca3af;
}
</style>
</head>

<body>
<div class="container">

<h2>AJ Transcript AI</h2>

<input id="ytUrl" placeholder="Paste YouTube link">
<button onclick="fetchTranscript()">Fetch Text</button>

<div id="status">Ready…</div>

<div id="resultBox"></div>

</div>

<script>

// ================= FETCH =================
async function fetchTranscript(){

const urlInput =
document.getElementById("ytUrl").value.trim();

if(!urlInput) return;

const videoId = extractVideoId(urlInput);

if(!videoId){
showStatus("❌ Invalid URL");
return;
}

showStatus("Fetching transcript…");

try{

const proxy = "https://corsproxy.io/?";

const captionUrl =
`https://www.youtube.com/api/timedtext?lang=en&v=${videoId}`;

const resp = await fetch(
proxy + encodeURIComponent(captionUrl)
);

const raw = await resp.text();

const finalText = parseTranscript(raw);

if(!finalText) throw new Error();

document.getElementById("resultBox").innerText =
finalText;

document.getElementById("resultBox").style.display =
"block";

showStatus("✅ Transcript fetched!");

}catch{

showStatus("❌ Captions not available");

}

}

// ================= PARSER =================
function parseTranscript(raw){

// XML captions
if(raw.includes("<text")){

const parser = new DOMParser();
const xmlDoc =
parser.parseFromString(raw,"text/xml");

const texts =
xmlDoc.getElementsByTagName("text");

let result="";

for(let i=0;i<texts.length;i++){
result += texts[i].textContent + " ";
}

return result.trim();
}

// JSON captions
try{
const json = JSON.parse(raw);

if(Array.isArray(json)){
return json.map(x=>x.text).join(" ");
}
}catch{}

// VTT fallback
return raw
.replace(/WEBVTT/g,"")
.replace(/\d{2}:\d{2}:\d{2}.\d{3} --> \d{2}:\d{2}:\d{2}.\d{3}/g,"")
.replace(/<[^>]*>/g,"")
.replace(/\n+/g," ")
.trim();

}

// ================= VIDEO ID =================
function extractVideoId(url){

const reg =
/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/|live\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/;

const match = url.match(reg);

return match ? match[1] : null;

}

// ================= STATUS =================
function showStatus(msg){
document.getElementById("status").innerText = msg;
}

</script>

</body>
</html>
