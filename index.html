<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Transcript Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');
        
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            color: white;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
        }

        .loader {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            display: none;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }
    </style>
</head>
<body class="flex flex-col items-center p-4 md:p-10">

    <div class="text-center mb-10">
        <h1 class="text-4xl md:text-5xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-emerald-400">
            YouTube Transcript Pro
        </h1>
        <p class="text-gray-400 mt-2">किसी भी वीडियो का ट्रांसक्रिप्ट तुरंत प्राप्त करें</p>
    </div>

    <div class="glass-card p-6 w-full max-w-2xl shadow-2xl">
        <div class="flex flex-col md:flex-row gap-4">
            <input type="text" id="videoUrl" 
                placeholder="YouTube URL यहाँ पेस्ट करें..." 
                class="flex-1 bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all text-sm">
            
            <button onclick="fetchTranscript()" id="fetchBtn"
                class="bg-blue-600 hover:bg-blue-500 text-white font-semibold px-6 py-3 rounded-xl transition-all flex items-center justify-center gap-2">
                <span id="btnText">ट्रांसक्रिप्ट निकालें</span>
                <div id="btnLoader" class="loader"></div>
            </button>
        </div>
        <p id="errorMsg" class="text-red-400 text-sm mt-3 hidden text-center"></p>
    </div>

    <div id="resultSection" class="w-full max-w-3xl mt-8 hidden">
        <div class="glass-card p-6 relative">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-semibold text-blue-300">वीडियो ट्रांसक्रिप्ट</h2>
                <button onclick="copyToClipboard()" class="text-gray-400 hover:text-white flex items-center gap-2 text-sm bg-slate-800 px-3 py-1 rounded-lg">
                    <i class="far fa-copy"></i> कॉपी करें
                </button>
            </div>
            
            <div id="transcriptContent" class="text-gray-300 leading-relaxed max-h-[500px] overflow-y-auto pr-4 text-justify">
                </div>
        </div>
    </div>

    <script>
        async function fetchTranscript() {
            const urlInput = document.getElementById('videoUrl').value;
            const btnText = document.getElementById('btnText');
            const btnLoader = document.getElementById('btnLoader');
            const errorMsg = document.getElementById('errorMsg');
            const resultSection = document.getElementById('resultSection');
            const content = document.getElementById('transcriptContent');

            // Reset UI
            errorMsg.classList.add('hidden');
            if (!urlInput.includes('youtube.com') && !urlInput.includes('youtu.be')) {
                showError("कृपया एक मान्य YouTube लिंक डालें।");
                return;
            }

            // Start Loading
            btnText.style.opacity = '0.5';
            btnLoader.style.display = 'block';

            try {
                // Extract Video ID
                const videoId = extractVideoId(urlInput);
                
                /* Note: YouTube does not allow direct scraping from browser. 
                   Using a helper microservice/proxy for demonstration.
                */
                const response = await fetch(`https://subtitles-api.vercel.app/api/transcript?v=${videoId}`);
                const data = await response.json();

                if (data.status === 'success') {
                    content.innerHTML = data.transcript.map(line => 
                        `<p class="mb-3"><span class="text-emerald-400 font-mono text-xs mr-2">[${line.start}]</span> ${line.text}</p>`
                    ).join('');
                    resultSection.classList.remove('hidden');
                    resultSection.scrollIntoView({ behavior: 'smooth' });
                } else {
                    throw new Error("इस वीडियो के लिए ट्रांसक्रिप्ट उपलब्ध नहीं है।");
                }

            } catch (err) {
                showError("त्रुटि: ट्रांसक्रिप्ट नहीं मिला। सुनिश्चित करें कि वीडियो में सबटाइटल्स चालू हैं।");
            } finally {
                btnText.style.opacity = '1';
                btnLoader.style.display = 'none';
            }
        }

        function extractVideoId(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        function showError(msg) {
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.innerText = msg;
            errorMsg.classList.remove('hidden');
        }

        function copyToClipboard() {
            const text = document.getElementById('transcriptContent').innerText;
            navigator.clipboard.writeText(text).then(() => {
                alert("ट्रांसक्रिप्ट कॉपी कर लिया गया है!");
            });
        }
    </script>
</body>
</html>
